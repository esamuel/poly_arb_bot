services:
  polybot:
    build: .
    container_name: poly_arb_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DASHBOARD_PORT=8080
      - DASHBOARD_AUTH_DISABLED=0
    expose:
      - "8080"
    volumes:
      - ./data:/app/poly_arb_bot/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: poly_arb_caddy
    restart: unless-stopped
    depends_on:
      - polybot
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN:-app.orbitarb.com}
      - TLS_EMAIL=${TLS_EMAIL:-}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
